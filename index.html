<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>誰かのホームページ & Updates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            scroll-behavior: smooth;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .gradient-text {
            background: linear-gradient(90deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -9px;
            top: 5px;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            border: 4px solid #0f172a;
        }

        .timeline-border {
            border-left: 2px solid rgba(59, 130, 246, 0.3);
        }

        /* Dropdown simple styling */
        .dropdown:hover .dropdown-menu {
            display: block;
        }
        
        .nav-link {
            transition: all 0.2s;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #60a5fa;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass-card rounded-none border-t-0 border-x-0">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold gradient-text">誰かのホームページ</div>
            
            <div class="flex items-center space-x-2 md:space-x-6">
                <a href="#about" class="nav-link text-sm md:text-base hidden sm:block">自己紹介</a>
                
                <!-- ゲーム Dropdown -->
                <div class="relative dropdown group">
                    <button class="nav-link text-sm md:text-base flex items-center font-bold text-blue-400">
                        ゲーム
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="dropdown-menu absolute right-0 mt-1 w-48 hidden pt-2">
                        <div class="glass-card bg-slate-800 shadow-2xl py-2 border border-blue-500/30 overflow-hidden">
                            <a href="https://akasatana-hamayarawa.github.io/tetris/" target="_blank" rel="noopener noreferrer" class="block px-4 py-3 hover:bg-blue-600 transition flex items-center text-white">
                                <span class="mr-3 text-lg">🕹️</span> 
                                <div>
                                    <div class="font-bold">テトリス</div>
                                    <div class="text-[10px] text-blue-200">外部サイトを開きます</div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>

                <a href="#updates" class="nav-link text-sm md:text-base">進捗</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="pt-40 pb-20 px-6">
        <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">
                <span class="text-white">暁人の</span><br class="md:hidden">
                <span class="gradient-text">デジタルポートフォリオ</span>
            </h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">
                日々の更新、制作したゲーム、そして自分自身についての記録。
            </p>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="py-20 px-6">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-3xl font-bold mb-10 flex items-center">
                <span class="w-10 h-1 bg-blue-500 mr-4 rounded-full"></span>
                自己紹介
            </h2>
            <div class="grid md:grid-cols-2 gap-10 items-center">
                <div class="glass-card p-8 border-l-4 border-l-blue-500">
                    <h3 class="text-2xl font-bold mb-4 text-white">暁人 (Akito)</h3>
                    <p class="text-gray-300 leading-relaxed mb-6">
                        こんにちは！暁人です。このページでは自分の活動や、追加した機能のログを公開しています。
                        新しいものを作ることや、ゲームが大好きです。
                    </p>
                    <div class="flex flex-wrap gap-3">
                        <span class="bg-blue-900/40 text-blue-300 border border-blue-500/30 px-4 py-1.5 rounded-full text-xs font-semibold">Web制作</span>
                        <span class="bg-purple-900/40 text-purple-300 border border-purple-500/30 px-4 py-1.5 rounded-full text-xs font-semibold">ゲーム好き</span>
                        <span class="bg-emerald-900/40 text-emerald-300 border border-emerald-500/30 px-4 py-1.5 rounded-full text-xs font-semibold">進化中</span>
                    </div>
                </div>
                <div class="relative group h-64">
                    <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl blur opacity-4
                    0 group-hover:opacity-40 transition duration-700"></div>
                    <div class="relative h-full glass-card overflow-hidden rounded-2xl border-slate-700">
    <img src="images/icon.svg" alt="暁人のアイコン" class="w-full h-full object-cover">
</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Updates Section -->
    <section id="updates" class="py-20 px-6 bg-slate-900/30">
        <div class="max-w-5xl mx-auto">
            <div class="flex flex-col md:flex-row md:justify-between md:items-end mb-12 gap-6">
                <div>
                    <h2 class="text-3xl font-bold mb-2">進捗ログ</h2>
                    <p class="text-gray-400">これまでの更新履歴です</p>
                </div>
                <button onclick="addUpdate()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl shadow-lg shadow-blue-900/20 transition-all font-bold flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    履歴を追加
                </button>
            </div>

            <div id="timeline-container" class="ml-4 timeline-border relative space-y-8 pb-10">
                <!-- タイムラインがここに表示されます -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 px-6 border-t border-slate-800 text-center">
        <div class="max-w-5xl mx-auto">
            <p class="text-gray-500 text-sm">© 2024 誰かのホームページ - Powered by Akito</p>
        </div>
    </footer>

    <!-- Modal -->
    <div id="update-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[100] flex items-center justify-center p-6">
        <div class="glass-card p-8 w-full max-w-md border-blue-500/50">
            <h3 class="text-xl font-bold mb-6 flex items-center">
                <span class="text-blue-400 mr-2">✨</span> 新しい進捗を記録
            </h3>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">日付</label>
                    <input type="date" id="input-date" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none text-white transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">更新内容</label>
                    <textarea id="input-text" rows="3" placeholder="例: テトリスのリンクをメニューに追加しました" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none text-white transition resize-none"></textarea>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button onclick="closeModal()" class="flex-1 px-4 py-3 border border-slate-700 rounded-lg hover:bg-slate-800 transition font-bold">戻る</button>
                    <button onclick="saveUpdate()" class="flex-1 px-4 py-3 bg-blue-600 rounded-lg hover:bg-blue-500 transition font-bold shadow-lg shadow-blue-900/20">保存する</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初期の履歴データ
        let updates = [
            { date: '2024-03-24', content: 'サイトのデザインを決定しました' },
            { date: '2024-03-25', content: '自己紹介を追加しました' },
            { date: '2024-03-26', content: 'メニューに「ゲーム」を追加し、テトリスと連携しました' }
        ];

        function renderUpdates() {
            const container = document.getElementById('timeline-container');
            const sorted = [...updates].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            container.innerHTML = sorted.map(update => {
                const dateObj = new Date(update.date);
                const dateStr = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
                
                return `
                    <div class="relative pl-8 opacity-0 translate-x-[-10px] animate-fade-in">
                        <div class="timeline-item"></div>
                        <div class="glass-card p-6 hover:bg-slate-800/80 transition-all border-slate-700/50 group">
                            <span class="inline-block px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 text-xs font-bold mb-2">${dateStr}</span>
                            <p class="text-gray-200">
                                暁人さんが<span class="text-white font-bold ml-1 mr-1">「${update.content}」</span>を追加しました。
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
            
            // シンプルなフェードインアニメーションのトリガー
            const items = container.querySelectorAll('.animate-fade-in');
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.style.transition = 'all 0.5s ease-out';
                    item.style.opacity = '1';
                    item.style.transform = 'translateX(0)';
                }, index * 100);
            });
        }

        function addUpdate() {
            document.getElementById('input-date').valueAsDate = new Date();
            document.getElementById('update-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // 背景スクロール禁止
        }

        function closeModal() {
            document.getElementById('update-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function saveUpdate() {
            const date = document.getElementById('input-date').value;
            const content = document.getElementById('input-text').value;

            if (date && content) {
                updates.push({ date, content });
                renderUpdates();
                closeModal();
                document.getElementById('input-text').value = '';
            }
        }

        window.onload = renderUpdates;
    </script>
</body>
</html>
